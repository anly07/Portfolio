  <p class="text-muted mt-4 max-w-xl">Every project, Figma design, and blog post I've published, grouped by year. Filter by type to narrow things down.</p>

<script>
const projects = [
  { type:"project", title:"Nimbus — Task Manager", desc:"A calm, minimal task manager with keyboard-first navigation and offline sync.", tags:["React","Tailwind"], icon:"📋", year:2026 },
  { type:"project", title:"Orbit Analytics", desc:"Realtime dashboard for tracking product usage across teams.", tags:["Next.js","Charts"], icon:"📊", year:2026 },
  { type:"project", title:"Fernweh Travel App", desc:"Booking flow redesign that cut checkout drop-off by streamlining steps.", tags:["UI/UX","Mobile"], icon:"🧭", year:2025 },
  { type:"project", title:"Loop Music Player", desc:"A gesture-based music player concept with fluid transitions.", tags:["Motion","React"], icon:"🎧", year:2025 },
  { type:"project", title:"Pixel Grocer", desc:"E-commerce storefront focused on speed and accessibility.", tags:["Shopify","A11y"], icon:"🛒", year:2025 },
  { type:"project", title:"Signal — Team Chat", desc:"Lightweight team chat UI with threaded replies and soft notifications.", tags:["WebSocket","UI"], icon:"💬", year:2024 },
  { type:"project", title:"Aria Weather App", desc:"A weather app concept with ambient, condition-based backgrounds.", tags:["React","Motion"], icon:"🌤️", year:2024 },
  { type:"project", title:"Cove Budgeting Tool", desc:"Personal finance tracker with a soft, non-judgmental tone.", tags:["Vue","Charts"], icon:"💰", year:2024 },
  { type:"project", title:"Drift Notes App", desc:"A distraction-free notes app with local-first storage.", tags:["React","PWA"], icon:"🗒️", year:2023 },
  { type:"project", title:"Beacon Portfolio Starter", desc:"An open, reusable portfolio starter template for developers.", tags:["Template","HTML"], icon:"🔦", year:2023 },
];
const designs = [
  { type:"design", title:"Aurora Design System", desc:"A full component library and token set built for a fintech product.", tags:["Figma","Design System"], icon:"🎨", year:2026 },
  { type:"design", title:"Fable — Reading App UI", desc:"Warm, editorial-style interface concept for a reading app.", tags:["Figma","Mobile"], icon:"📖", year:2026 },
  { type:"design", title:"Kiln Dashboard Kit", desc:"Dashboard UI kit with 40+ reusable data components.", tags:["Figma","Dashboard"], icon:"🧩", year:2025 },
  { type:"design", title:"Wander Travel Wireframes", desc:"Low to high fidelity wireframes for a travel booking concept.", tags:["Figma","Wireframe"], icon:"✈️", year:2025 },
  { type:"design", title:"Sprout Onboarding Flow", desc:"Friendly onboarding sequence with progressive disclosure.", tags:["Figma","Flow"], icon:"🌱", year:2025 },
  { type:"design", title:"Halo Icon Set", desc:"A soft, rounded 200+ icon set for product UIs.", tags:["Figma","Icons"], icon:"🔆", year:2024 },
  { type:"design", title:"Ember Landing Page Kit", desc:"A set of modular landing page sections for quick assembly.", tags:["Figma","Kit"], icon:"🔥", year:2024 },
  { type:"design", title:"Marsh Illustration Pack", desc:"A set of soft, hand-styled illustrations for empty states.", tags:["Figma","Illustration"], icon:"🖍️", year:2024 },
  { type:"design", title:"Tide E-commerce UI", desc:"A full storefront and checkout UI concept.", tags:["Figma","E-commerce"], icon:"🌊", year:2023 },
  { type:"design", title:"Glow Presentation Deck", desc:"A reusable Figma slide deck template for pitches.", tags:["Figma","Deck"], icon:"✨", year:2023 },
];
const posts = [
  { type:"blog", tag:"Blog", title:"Designing motion that feels invisible", desc:"Notes on using animation to guide attention without ever calling attention to itself.", icon:"📝", year:2026 },
  { type:"blog", tag:"Reel", title:"Behind the scenes: Aurora Design System", desc:"A 60-second walkthrough of building a token-based component library.", icon:"🎬", year:2026 },
  { type:"blog", tag:"Blog", title:"Dark mode, done softly", desc:"Why soft contrast beats pure black for long reading sessions — with examples.", icon:"📝", year:2025 },
  { type:"blog", tag:"Blog", title:"5 Figma plugins I use every week", desc:"The small plugins that quietly save hours on every design system project.", icon:"📝", year:2025 },
  { type:"blog", tag:"Reel", title:"Building a card hover in 60 seconds", desc:"A quick reel breaking down a hover micro-interaction, frame by frame.", icon:"🎬", year:2025 },
  { type:"blog", tag:"Blog", title:"Why soft shadows beat hard shadows", desc:"A short case for gentler elevation in modern interfaces.", icon:"📝", year:2024 },
  { type:"blog", tag:"Reel", title:"My 2024 toolbox", desc:"A quick tour of every app and plugin in my creative stack this year.", icon:"🎬", year:2024 },
  { type:"blog", tag:"Blog", title:"From wireframe to ship: a case study", desc:"A full walkthrough of one project from first sketch to launch.", icon:"📝", year:2023 },
];

const all = [...projects, ...designs, ...posts];
const typeLabel = { project:"Project", design:"Design", blog:null };

function itemRow(item){
  const tag = item.type === 'blog' ? item.tag : typeLabel[item.type];
  const tagClass = item.type === 'project' ? 'type-project' : item.type === 'design' ? 'type-design' : 'type-blog';
  const tagsHtml = item.tags ? item.tags.map(t=>`<span class="pill">${t}</span>`).join("") : "";
  const ctaHref = item.type === 'blog' ? '#' : 'index.html#contact';
  const ctaLabel = item.type === 'blog' ? (item.tag === 'Reel' ? 'Watch reel' : 'Read post') : 'Get in touch';
  return `<article class="row reveal p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center gap-4">
    <div class="w-14 h-14 shrink-0 rounded-xl bg-app-soft grid place-items-center text-2xl">${item.icon}</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="type-tag ${tagClass}">${tag}</span>
        <span class="font-mono text-xs text-muted">${item.year}</span>
      </div>
      <h3 class="font-display text-lg font-semibold mt-2">${item.title}</h3>
      <p class="text-sm text-muted mt-1 leading-relaxed">${item.desc}</p>
      ${tagsHtml ? `<div class="flex flex-wrap gap-2 mt-3">${tagsHtml}</div>` : ""}
    </div>
    <a href="${ctaHref}" class="btn btn-outline text-sm shrink-0 justify-center">${ctaLabel}</a>
  </article>`;
}

function render(filter){
  const items = filter === 'all' ? all : all.filter(i => i.type === filter);
  const years = [...new Set(items.map(i => i.year))].sort((a,b) => b - a);
  const container = document.getElementById('archive-content');

  if(items.length === 0){
    container.innerHTML = `<p class="text-muted">Nothing here yet.</p>`;
    return;
  }

  container.innerHTML = years.map(year => {
    const yearItems = items.filter(i => i.year === year).sort((a,b)=> a.title.localeCompare(b.title));
    return `
    <div>
      <div class="flex items-center gap-4 mb-6">
        <h2 class="font-display text-2xl font-semibold">${year}</h2>
        <span class="year-rule"></span>
        <span class="font-mono text-xs text-muted">${String(yearItems.length).padStart(2,'0')} items</span>
      </div>
      <div class="space-y-4">${yearItems.map(itemRow).join("")}</div>
    </div>`;
  }).join("");

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: .1 });
  container.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

/* filters + query param support (?type=projects|designs|blog) */
const filterMap = { projects:'project', designs:'design', blog:'blog' };
const params = new URLSearchParams(window.location.search);
const initial = filterMap[params.get('type')] || 'all';

document.querySelectorAll('.filter-btn').forEach(btn => {
  if(btn.dataset.filter === initial) { document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
    const url = new URL(window.location);
    if(btn.dataset.filter === 'all') url.searchParams.delete('type');
    else url.searchParams.set('type', Object.keys(filterMap).find(k => filterMap[k] === btn.dataset.filter) || btn.dataset.filter);
    window.history.replaceState({}, '', url);
  });
});
render(initial);

/* theme: shared appearance engine (js/theme.js) */
document.getElementById('theme-toggle').addEventListener('click', () => PortfolioTheme.toggle());
PortfolioTheme.fetchSettings("https://script.google.com/macros/s/AKfycbyKbUDLrkVJqw4D8FsZ9akzXvLfBvb1iounKKR8IyaDyOD5BY9nnkMdYJtyistbqN_oKg/exec");

document.getElementById('year').textContent = new Date().getFullYear();
</script>
